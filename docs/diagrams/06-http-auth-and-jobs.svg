<text x="40" y="55" class="heading" font-size="32" fill="#0f172a">06 / HTTP identity, durable jobs and confirmed execution</text>
<text x="40" y="90" font-size="18" fill="#475569">Separate processes and service identities; browser contracts stay independent of the model and MCP implementation.</text>
<text x="40" y="120" font-size="16" fill="#475569">Time flows downward | Solid arrow: call | Dashed arrow: reply | Yellow: explanation</text>
