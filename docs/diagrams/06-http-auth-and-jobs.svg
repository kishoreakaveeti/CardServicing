<text x="2090.0" y="187" text-anchor="middle" class="heading" font-size="19" fill="white">SQLite journals</text>
<rect x="35" y="245" width="2150" height="49" rx="5" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="55" y="270" font-size="17" fill="#1e293b">Five application containers plus Keycloak. Each internal receiver validates its destination bearer token. Customer identity is a separately signed BFF assertion, never a browser user-ID header.</text>
<rect x="143.25" y="301" width="253.5" height="31" fill="white"/>
<text x="270.0" y="321" text-anchor="middle" font-size="16" fill="#0f172a">OIDC sign-in and callback</text>
<path d="M130.0 339 H410.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="423.25" y="372" width="253.5" height="79" fill="white"/>
<text x="550.0" y="392" text-anchor="middle" font-size="16" fill="#0f172a">Authorization code + PKCE</text>
<text x="550.0" y="416" text-anchor="middle" font-size="16" fill="#0f172a">exchange; verify state,</text>
<text x="550.0" y="440" text-anchor="middle" font-size="16" fill="#0f172a">nonce and signed ID token</text>
<path d="M410.0 458 H690.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="133.75" y="491" width="272.5" height="55" fill="white"/>
<text x="270.0" y="511" text-anchor="middle" font-size="16" fill="#0f172a">Opaque HttpOnly server-side</text>
<text x="270.0" y="535" text-anchor="middle" font-size="16" fill="#0f172a">session + CSRF token</text>
<path d="M410.0 553 H130.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="138.5" y="586" width="263.0" height="55" fill="white"/>
<text x="270.0" y="606" text-anchor="middle" font-size="16" fill="#0f172a">Message with session, CSRF</text>
<text x="270.0" y="630" text-anchor="middle" font-size="16" fill="#0f172a">and submission key</text>
<path d="M130.0 648 H410.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="435.0" y="681" width="510.0" height="55" fill="white"/>
<text x="690.0" y="701" text-anchor="middle" font-size="16" fill="#0f172a">Typed request, Agent audience token, signed customer</text>
<text x="690.0" y="725" text-anchor="middle" font-size="16" fill="#0f172a">assertion and correlation ID</text>
<path d="M410.0 743 H970.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1227.5" y="776" width="605.0" height="31" fill="white"/>
<text x="1530.0" y="796" text-anchor="middle" font-size="16" fill="#0f172a">Durably accept caller-owned operation; 202 mode can return now</text>
<path d="M970.0 814 H2090.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="973.75" y="847" width="272.5" height="151" fill="white"/>
<text x="1110.0" y="867" text-anchor="middle" font-size="16" fill="#0f172a">Shared allowlist builder:</text>
<text x="1110.0" y="891" text-anchor="middle" font-size="16" fill="#0f172a">recent sanitised turns,</text>
<text x="1110.0" y="915" text-anchor="middle" font-size="16" fill="#0f172a">opaque verified draft</text>
<text x="1110.0" y="939" text-anchor="middle" font-size="16" fill="#0f172a">facts, stable eligible tool</text>
<text x="1110.0" y="963" text-anchor="middle" font-size="16" fill="#0f172a">schemas; optional static-</text>
<text x="1110.0" y="987" text-anchor="middle" font-size="16" fill="#0f172a">prefix cache</text>
<path d="M970.0 1005 H1250.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="988.0" y="1038" width="244.0" height="79" fill="white"/>
<text x="1110.0" y="1058" text-anchor="middle" font-size="16" fill="#0f172a">Propose one tool and</text>
<text x="1110.0" y="1082" text-anchor="middle" font-size="16" fill="#0f172a">arguments, follow-up, or</text>
<text x="1110.0" y="1106" text-anchor="middle" font-size="16" fill="#0f172a">reply</text>
<path d="M1250.0 1124 H970.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="416.0" y="1157" width="548.0" height="55" fill="white"/>
<text x="690.0" y="1177" text-anchor="middle" font-size="16" fill="#0f172a">Masked review bound to exact proposal; synchronous reply</text>
<text x="690.0" y="1201" text-anchor="middle" font-size="16" fill="#0f172a">or poll result</text>
<path d="M970.0 1219 H410.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="138.5" y="1252" width="263.0" height="31" fill="white"/>
<text x="270.0" y="1272" text-anchor="middle" font-size="16" fill="#0f172a">Confirm the current review</text>
<path d="M130.0 1290 H410.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="492.0" y="1323" width="396.0" height="31" fill="white"/>
<text x="690.0" y="1343" text-anchor="middle" font-size="16" fill="#0f172a">Forward authenticated typed confirmation</text>
<path d="M410.0 1361 H970.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1237.0" y="1394" width="586.0" height="31" fill="white"/>
<text x="1530.0" y="1414" text-anchor="middle" font-size="16" fill="#0f172a">Persist reviewed snapshot and execution key before any write</text>
<path d="M970.0 1432 H2090.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="971.25" y="1465" width="557.5" height="31" fill="white"/>
<text x="1250.0" y="1485" text-anchor="middle" font-size="16" fill="#0f172a">Streamable HTTP tools/call with MCP-specific bearer token</text>
<path d="M970.0 1503 H1530.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1533.75" y="1536" width="272.5" height="103" fill="white"/>
<text x="1670.0" y="1556" text-anchor="middle" font-size="16" fill="#0f172a">Registered REST</text>
<text x="1670.0" y="1580" text-anchor="middle" font-size="16" fill="#0f172a">destination; Cards-specific</text>
<text x="1670.0" y="1604" text-anchor="middle" font-size="16" fill="#0f172a">bearer, verified customer</text>
<text x="1670.0" y="1628" text-anchor="middle" font-size="16" fill="#0f172a">assertion, Idempotency-Key</text>
<path d="M1530.0 1646 H1810.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1828.0" y="1679" width="244.0" height="79" fill="white"/>
<text x="1950.0" y="1699" text-anchor="middle" font-size="16" fill="#0f172a">Authorize account;</text>
<text x="1950.0" y="1723" text-anchor="middle" font-size="16" fill="#0f172a">atomically save card and</text>
<text x="1950.0" y="1747" text-anchor="middle" font-size="16" fill="#0f172a">replay response</text>
<path d="M1810.0 1765 H2090.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1538.5" y="1798" width="263.0" height="55" fill="white"/>
<text x="1670.0" y="1818" text-anchor="middle" font-size="16" fill="#0f172a">Validated structured Cards</text>
<text x="1670.0" y="1842" text-anchor="middle" font-size="16" fill="#0f172a">result</text>
<path d="M1810.0 1860 H1530.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="1137.5" y="1893" width="225.0" height="31" fill="white"/>
<text x="1250.0" y="1913" text-anchor="middle" font-size="16" fill="#0f172a">Structured tool result</text>
<path d="M1530.0 1931 H970.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="1251.25" y="1964" width="557.5" height="31" fill="white"/>
<text x="1530.0" y="1984" text-anchor="middle" font-size="16" fill="#0f172a">Commit conversation + completed operation result together</text>
<path d="M970.0 2002 H2090.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="577.5" y="2035" width="225.0" height="31" fill="white"/>
<text x="690.0" y="2055" text-anchor="middle" font-size="16" fill="#0f172a">Stable UI-ready result</text>
<path d="M970.0 2073 H410.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="143.25" y="2106" width="253.5" height="55" fill="white"/>
<text x="270.0" y="2126" text-anchor="middle" font-size="16" fill="#0f172a">Result via response or</text>
<text x="270.0" y="2150" text-anchor="middle" font-size="16" fill="#0f172a">authenticated BFF polling</text>
<path d="M410.0 2168 H130.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="35" y="2206" width="2150" height="74" rx="5" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="55" y="2231" font-size="17" fill="#1e293b">Storage lifelines represent separate Agent, Experience and Cards SQLite databases/volumes, not a shared database. Running jobs recover on restart. Uncertain supported writes reuse the original downstream</text>
<text x="55" y="2256" font-size="17" fill="#1e293b">key; non-idempotent writes are never replayed automatically.</text>
