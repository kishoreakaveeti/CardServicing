<title id="title">06 / HTTP identity, durable jobs and confirmed execution - sequence diagram</title>
<desc id="description">Separate processes and service identities; browser contracts stay independent of the model and MCP implementation. Read interactions from top to bottom. Dashed arrows are replies.</desc>
