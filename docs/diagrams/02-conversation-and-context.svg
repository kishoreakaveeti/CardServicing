<text x="1015.0" y="187" text-anchor="middle" class="heading" font-size="19" fill="white">Agent / adapter</text>
<path d="M1310.0 207 V2777" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="1199.0" y="155" width="222" height="52" rx="7" fill="#9a3412"/>
<text x="1310.0" y="187" text-anchor="middle" class="heading" font-size="19" fill="white">Hosted Claude</text>
<rect x="35" y="245" width="1370" height="74" rx="5" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="55" y="270" font-size="17" fill="#1e293b">Private inputs bypass chat: the secure form and masked account picker produce a review with zero model calls. Only scoped opaque</text>
<text x="55" y="295" font-size="17" fill="#1e293b">references enter verified draft facts. Private pastes and ambiguous older references trigger deterministic clarification.</text>
<rect x="35" y="331" width="1370" height="74" rx="5" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="55" y="356" font-size="17" fill="#1e293b">React calls only Experience. OIDC session + CSRF at the browser boundary; separate bearer identities internally. Agent journals</text>
<text x="55" y="381" font-size="17" fill="#1e293b">jobs and reviewed submissions in SQLite before execution.</text>
