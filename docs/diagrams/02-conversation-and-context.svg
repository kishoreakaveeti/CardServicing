<text x="40" y="55" class="heading" font-size="32" fill="#0f172a">02 / Each message and the question loop</text>
<text x="40" y="90" font-size="18" fill="#475569">Bounded sanitised context and eligible schemas reach Claude; private values stay in caller-bound server state.</text>
<text x="40" y="120" font-size="16" fill="#475569">Time flows downward | Solid arrow: call | Dashed arrow: reply | Yellow: explanation</text>
