<title id="title">02 / Each message and the question loop - sequence diagram</title>
<desc id="description">Bounded sanitised context and eligible schemas reach Claude; private values stay in caller-bound server state. Read interactions from top to bottom. Dashed arrows are replies.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#334155"/></marker></defs>
