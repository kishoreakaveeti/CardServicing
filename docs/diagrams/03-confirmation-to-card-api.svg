<rect x="1459.0" y="155" width="222" height="52" rx="7" fill="#334155"/>
<text x="1570.0" y="187" text-anchor="middle" class="heading" font-size="19" fill="white">SQLite</text>
<rect x="35" y="245" width="1630" height="74" rx="5" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="55" y="270" font-size="17" fill="#1e293b">React calls only Experience. OIDC session + CSRF at the browser boundary; separate bearer identities internally. Agent journals jobs and reviewed</text>
<text x="55" y="295" font-size="17" fill="#1e293b">submissions in SQLite before execution.</text>
<rect x="35" y="331" width="1630" height="49" rx="5" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="55" y="356" font-size="17" fill="#1e293b">Before this sequence, Claude has already selected an action and the workflow has validated its review.</text>
<rect x="147.25" y="387" width="253.5" height="55" fill="white"/>
<text x="274.0" y="407" text-anchor="middle" font-size="16" fill="#0f172a">Click action button: POST</text>
<text x="274.0" y="431" text-anchor="middle" font-size="16" fill="#0f172a">/confirm {review}</text>
