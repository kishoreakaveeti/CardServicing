<text x="40" y="55" class="heading" font-size="32" fill="#0f172a">03 / Confirmation to REST creation</text>
<text x="40" y="90" font-size="18" fill="#475569">Confirmation executes the stored proposal directly: no Claude call and no tool-specific routing.</text>
<text x="40" y="120" font-size="16" fill="#475569">Time flows downward | Solid arrow: call | Dashed arrow: reply | Yellow: explanation</text>
