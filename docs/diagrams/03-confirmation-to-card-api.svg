<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2079" viewBox="0 0 1200 2079" role="img" aria-labelledby="title description">
<title id="title">03 / Confirmation to REST creation</title>
<desc id="description">A model proposal is checked locally. The workflow executes confirmed values, not model authority.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs>
<style>text{font-family:Consolas,"Liberation Mono",monospace}.heading{font-family:Arial,sans-serif;font-weight:700}</style>
<rect width="1200" height="2079" fill="#f1f5f9"/>
<text x="60" y="65" class="heading" font-size="32" fill="#0f172a">03 / Confirmation to REST creation</text>
<text x="60" y="105" font-size="18" fill="#475569">A model proposal is checked locally. The workflow executes confirmed values, not model</text>
<text x="60" y="131" font-size="18" fill="#475569">authority.</text>
<rect x="60" y="170" width="1080" height="167" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="170" width="9" height="167" rx="4" fill="#155e75"/>
<text x="88" y="205" class="heading" font-size="23" fill="#155e75">01 / Customer explicitly clicks Create card</text>
<text x="88" y="239" font-size="18" fill="#1e293b">POST /conversations/{cid}/confirm contains the review token, not a replacement draft. Merely</text>
<text x="88" y="266" font-size="18" fill="#1e293b">typing &#x27;yes&#x27; uses the message route and does not execute MCP.</text>
<a href="../../src/card_chat/index.html"><text x="88" y="300" font-size="16" fill="#1d4ed8">src/card_chat/index.html:21</text></a>
<path d="M600 342 V375" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="385" width="1080" height="219" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="385" width="9" height="219" rx="4" fill="#1d4ed8"/>
<text x="88" y="420" class="heading" font-size="23" fill="#1d4ed8">02 / Check review token and freeze the submission</text>
<text x="88" y="454" font-size="18" fill="#1e293b">Under the conversation lock, reject a stale review with 409. On the first valid click,</text>
<text x="88" y="481" font-size="18" fill="#1e293b">validate the saved draft, copy it into submission.body, and generate one UUID key. If a</text>
<text x="88" y="508" font-size="18" fill="#1e293b">successful result is already saved, return it immediately.</text>
<a href="../../src/card_chat/main.py"><text x="88" y="542" font-size="16" fill="#1d4ed8">src/card_chat/main.py:123</text></a>
<a href="../../src/card_chat/main.py"><text x="88" y="567" font-size="16" fill="#1d4ed8">src/card_chat/main.py:129</text></a>
<path d="M600 609 V642" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="652" width="1080" height="219" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="652" width="9" height="219" rx="4" fill="#9a3412"/>
<text x="88" y="687" class="heading" font-size="23" fill="#9a3412">03 / Agent offers create_card through the Anthropic adapter</text>
<text x="88" y="721" font-size="18" fill="#1e293b">allowed_tools now contains only create_card with the discovered model-facing schema. propose()</text>
<text x="88" y="748" font-size="18" fill="#1e293b">sends the confirmed body, forces one named tool call, and disables parallel tool use. Claude</text>
<text x="88" y="775" font-size="18" fill="#1e293b">returns tool_use with a name and arguments; it does not execute the tool.</text>
<a href="../../src/card_chat/agent.py"><text x="88" y="809" font-size="16" fill="#1d4ed8">src/card_chat/agent.py:37</text></a>
<a href="../../src/card_chat/provider.py"><text x="88" y="834" font-size="16" fill="#1d4ed8">src/card_chat/provider.py:17</text></a>
<path d="M600 876 V909" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="919" width="1080" height="219" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="919" width="9" height="219" rx="4" fill="#1d4ed8"/>
<text x="88" y="954" class="heading" font-size="23" fill="#1d4ed8">04 / Approve only a matching proposal</text>
<text x="88" y="988" font-size="18" fill="#1e293b">Require a ProposedToolCall named create_card. Validate its arguments with CardCreate and</text>
<text x="88" y="1015" font-size="18" fill="#1e293b">compare normalized values with submission.body. Reject mismatches. Call gateway.create with</text>
<text x="88" y="1042" font-size="18" fill="#1e293b">the frozen server-side body and submission key.</text>
<a href="../../src/card_chat/main.py"><text x="88" y="1076" font-size="16" fill="#1d4ed8">src/card_chat/main.py:136</text></a>
<a href="../../src/card_chat/main.py"><text x="88" y="1101" font-size="16" fill="#1d4ed8">src/card_chat/main.py:139</text></a>
<path d="M600 1143 V1176" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="1186" width="1080" height="219" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="1186" width="9" height="219" rx="4" fill="#047857"/>
<text x="88" y="1221" class="heading" font-size="23" fill="#047857">05 / Gateway dispatches over stdio; MCP calls ApiClient</text>
<text x="88" y="1255" font-size="18" fill="#1e293b">ClientSession.call_tool sends create_card plus body and injected idempotency_key. The</text>
<text x="88" y="1282" font-size="18" fill="#1e293b">registered function validates CardCreate, creates ApiClient using CARD_API_BASE_URL, and</text>
<text x="88" y="1309" font-size="18" fill="#1e293b">invokes its existing create_card method.</text>
<a href="../../src/card_chat/gateway.py"><text x="88" y="1343" font-size="16" fill="#1d4ed8">src/card_chat/gateway.py:21</text></a>
<a href="../../src/card_chat/mcp_server.py"><text x="88" y="1368" font-size="16" fill="#1d4ed8">src/card_chat/mcp_server.py:25</text></a>
<path d="M600 1410 V1443" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="1453" width="1080" height="219" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="1453" width="9" height="219" rx="4" fill="#0f766e"/>
<text x="88" y="1488" class="heading" font-size="23" fill="#0f766e">06 / HTTP POST /cards validates and writes idempotently</text>
<text x="88" y="1522" font-size="18" fill="#1e293b">ApiClient sends JSON and the Idempotency-Key header over HTTP. FastAPI validates CardCreate</text>
<text x="88" y="1549" font-size="18" fill="#1e293b">and the required header, then invokes store.create_idempotent. The normal API uses SQLite.</text>
<text x="88" y="1576" font-size="18" fill="#1e293b">Account existence is assumed; there is no account lookup.</text>
<a href="../../src/api_client/client.py"><text x="88" y="1610" font-size="16" fill="#1d4ed8">src/api_client/client.py:31</text></a>
<a href="../../src/card_servicing/cards.py"><text x="88" y="1635" font-size="16" fill="#1d4ed8">src/card_servicing/cards.py:47</text></a>
<path d="M600 1677 V1710" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="1720" width="1080" height="246" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="1720" width="9" height="246" rx="4" fill="#1d4ed8"/>
<text x="88" y="1755" class="heading" font-size="23" fill="#1d4ed8">07 / Return the actual API result to the browser</text>
<text x="88" y="1789" font-size="18" fill="#1e293b">REST returns 201. MCP validates the Card response and returns {ok, id, card_number}. Chat</text>
<text x="88" y="1816" font-size="18" fill="#1e293b">saves the successful result and formats the final reply. The browser renders textContent. No</text>
<text x="88" y="1843" font-size="18" fill="#1e293b">extra Claude call summarizes the result; errors/timeouts remain retryable with the frozen</text>
<text x="88" y="1870" font-size="18" fill="#1e293b">submission.</text>
<a href="../../src/card_chat/mcp_server.py"><text x="88" y="1904" font-size="16" fill="#1d4ed8">src/card_chat/mcp_server.py:29</text></a>
<a href="../../src/card_chat/main.py"><text x="88" y="1929" font-size="16" fill="#1d4ed8">src/card_chat/main.py:142</text></a>
<text x="60" y="2051" font-size="15" fill="#475569">Source: card-chat-flows.json | Regenerate: python scripts/render_chat_diagrams.py</text>
</svg>
