<rect x="431.5" y="397" width="282.0" height="79" fill="white"/>
<text x="572.5" y="417" text-anchor="middle" font-size="16" fill="#0f172a">Typed HTTP contract; service</text>
<text x="572.5" y="441" text-anchor="middle" font-size="16" fill="#0f172a">token + signed customer</text>
<text x="572.5" y="465" text-anchor="middle" font-size="16" fill="#0f172a">assertion</text>
<path d="M425.0 483 H720.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730.25" y="516" width="234.5" height="103" fill="white"/>
<text x="847.5" y="536" text-anchor="middle" font-size="16" fill="#0f172a">Store reviewed</text>
<text x="847.5" y="560" text-anchor="middle" font-size="16" fill="#0f172a">tool/arguments; one key</text>
<text x="847.5" y="584" text-anchor="middle" font-size="16" fill="#0f172a">if contract supports</text>
<text x="847.5" y="608" text-anchor="middle" font-size="16" fill="#0f172a">replay</text>
<path d="M720.0 626 H785.0 V648 H720.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="750.25" y="684" width="234.5" height="55" fill="white"/>
<text x="867.5" y="704" text-anchor="middle" font-size="16" fill="#0f172a">Via MCP/shared HTTP:</text>
<text x="867.5" y="728" text-anchor="middle" font-size="16" fill="#0f172a">confirmed body B, key K</text>
<path d="M720.0 746 H1015.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1035.75" y="779" width="253.5" height="55" fill="white"/>
<text x="1162.5" y="799" text-anchor="middle" font-size="16" fill="#0f172a">Normalize B; fingerprint;</text>
<text x="1162.5" y="823" text-anchor="middle" font-size="16" fill="#0f172a">BEGIN IMMEDIATE; lookup K</text>
<path d="M1015.0 841 H1310.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="879" width="1370" height="49" rx="5" fill="#e0e7ff" stroke="#cbd5e1"/>
<text x="55" y="904" font-size="17" fill="#1e293b">New K: atomically create card and original response snapshot</text>
<rect x="1021.5" y="935" width="282.0" height="103" fill="white"/>
<text x="1162.5" y="955" text-anchor="middle" font-size="16" fill="#0f172a">Create only when eligible;</text>
<text x="1162.5" y="979" text-anchor="middle" font-size="16" fill="#0f172a">persist original and</text>
<text x="1162.5" y="1003" text-anchor="middle" font-size="16" fill="#0f172a">issuance-decision snapshots;</text>
<text x="1162.5" y="1027" text-anchor="middle" font-size="16" fill="#0f172a">commit</text>
<path d="M1015.0 1045 H1310.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1092.75" y="1078" width="139.5" height="31" fill="white"/>
<text x="1162.5" y="1098" text-anchor="middle" font-size="16" fill="#0f172a">Original card</text>
