<text x="40" y="55" class="heading" font-size="32" fill="#0f172a">04 / Idempotency and retries</text>
<text x="40" y="90" font-size="18" fill="#475569">Replay-supported writes reuse a frozen key; non-idempotent writes cannot retry an uncertain attempt.</text>
<text x="40" y="120" font-size="16" fill="#475569">Time flows downward | Solid arrow: call | Dashed arrow: reply | Yellow: explanation</text>
