<text x="55" y="2431" font-size="17" fill="#1e293b">After an attempted write loses its result, disable retry and reject repeated execution. Check status first.</text>
<rect x="35" y="2467" width="1370" height="49" rx="5" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="55" y="2492" font-size="17" fill="#1e293b">Same key + different body returns 409. Chat state is memory-only; a new key is a new operation.</text>
