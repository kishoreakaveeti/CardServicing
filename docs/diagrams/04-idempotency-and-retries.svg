<title id="title">04 / Idempotency and retries - sequence diagram</title>
<desc id="description">Replay-supported writes reuse a frozen key; non-idempotent writes cannot retry an uncertain attempt. Read interactions from top to bottom. Dashed arrows are replies.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#334155"/></marker></defs>
