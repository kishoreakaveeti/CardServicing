<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2027" viewBox="0 0 1200 2027" role="img" aria-labelledby="title description">
<title id="title">04 / Idempotency and retries</title>
<desc id="description">Chat prevents duplicate submissions in memory; SQLite durably protects repeated HTTP requests.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#64748b"/></marker></defs>
<style>text{font-family:Consolas,"Liberation Mono",monospace}.heading{font-family:Arial,sans-serif;font-weight:700}</style>
<rect width="1200" height="2027" fill="#f1f5f9"/>
<text x="60" y="65" class="heading" font-size="32" fill="#0f172a">04 / Idempotency and retries</text>
<text x="60" y="105" font-size="18" fill="#475569">Chat prevents duplicate submissions in memory; SQLite durably protects repeated HTTP requests.</text>
<rect x="60" y="170" width="1080" height="219" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="170" width="9" height="219" rx="4" fill="#1d4ed8"/>
<text x="88" y="205" class="heading" font-size="23" fill="#1d4ed8">01 / One confirmation creates one frozen body and key</text>
<text x="88" y="239" font-size="18" fill="#1e293b">The conversation lock serializes duplicate clicks. The first valid click generates a key;</text>
<text x="88" y="266" font-size="18" fill="#1e293b">failed attempts keep the same body/key. Completed duplicate clicks return the saved result</text>
<text x="88" y="293" font-size="18" fill="#1e293b">without calling Claude, MCP or REST again.</text>
<a href="../../src/card_chat/main.py"><text x="88" y="327" font-size="16" fill="#1d4ed8">src/card_chat/main.py:128</text></a>
<a href="../../src/card_chat/main.py"><text x="88" y="352" font-size="16" fill="#1d4ed8">src/card_chat/main.py:131</text></a>
<path d="M600 394 V427" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="437" width="1080" height="194" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="437" width="9" height="194" rx="4" fill="#0f766e"/>
<text x="88" y="472" class="heading" font-size="23" fill="#0f766e">02 / Normalize and fingerprint the request</text>
<text x="88" y="506" font-size="18" fill="#1e293b">CardCreate trims surrounding whitespace and validates values. fingerprint() serializes the</text>
<text x="88" y="533" font-size="18" fill="#1e293b">validated fields with sorted keys and compact JSON, then computes SHA-256. The account remains</text>
<text x="88" y="560" font-size="18" fill="#1e293b">a string, including its leading zeros.</text>
<a href="../../src/card_servicing/idempotency.py"><text x="88" y="594" font-size="16" fill="#1d4ed8">src/card_servicing/idempotency.py:12</text></a>
<path d="M600 636 V669" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="679" width="1080" height="192" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="679" width="9" height="192" rx="4" fill="#334155"/>
<text x="88" y="714" class="heading" font-size="23" fill="#334155">03 / Begin a SQLite write transaction and look up the key</text>
<text x="88" y="748" font-size="18" fill="#1e293b">BEGIN IMMEDIATE serializes writers before checking card_idempotency. Lookup and inserts share</text>
<text x="88" y="775" font-size="18" fill="#1e293b">one transaction, including across separate API processes using the same SQLite database.</text>
<a href="../../src/card_servicing/persistence.py"><text x="88" y="809" font-size="16" fill="#1d4ed8">src/card_servicing/persistence.py:69</text></a>
<a href="../../src/card_servicing/persistence.py"><text x="88" y="834" font-size="16" fill="#1d4ed8">src/card_servicing/persistence.py:76</text></a>
<path d="M600 876 V909" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="919" width="1080" height="219" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="919" width="9" height="219" rx="4" fill="#334155"/>
<text x="88" y="954" class="heading" font-size="23" fill="#334155">04 / Case A: unseen key creates card plus saved response</text>
<text x="88" y="988" font-size="18" fill="#1e293b">Generate a UUID id and SIM- identifier. Insert cards row and card_idempotency row with key,</text>
<text x="88" y="1015" font-size="18" fill="#1e293b">fingerprint, card_id and original response_json. Commit both together. Return 201 with</text>
<text x="88" y="1042" font-size="18" fill="#1e293b">Idempotency-Replayed: false.</text>
<a href="../../src/card_servicing/persistence.py"><text x="88" y="1076" font-size="16" fill="#1d4ed8">src/card_servicing/persistence.py:81</text></a>
<a href="../../src/card_servicing/persistence.py"><text x="88" y="1101" font-size="16" fill="#1d4ed8">src/card_servicing/persistence.py:84</text></a>
<path d="M600 1143 V1176" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="1186" width="1080" height="219" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="1186" width="9" height="219" rx="4" fill="#334155"/>
<text x="88" y="1221" class="heading" font-size="23" fill="#334155">05 / Case B: same key and same body replays the card</text>
<text x="88" y="1255" font-size="18" fill="#1e293b">If the stored fingerprint matches, return the saved response instead of inserting. Return 201</text>
<text x="88" y="1282" font-size="18" fill="#1e293b">with Idempotency-Replayed: true. If a commit succeeded but the first response was lost,</text>
<text x="88" y="1309" font-size="18" fill="#1e293b">retrying the same key/body returns that original card.</text>
<a href="../../src/card_servicing/persistence.py"><text x="88" y="1343" font-size="16" fill="#1d4ed8">src/card_servicing/persistence.py:80</text></a>
<a href="../../src/card_servicing/cards.py"><text x="88" y="1368" font-size="16" fill="#1d4ed8">src/card_servicing/cards.py:57</text></a>
<path d="M600 1410 V1443" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="1453" width="1080" height="219" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="1453" width="9" height="219" rx="4" fill="#0f766e"/>
<text x="88" y="1488" class="heading" font-size="23" fill="#0f766e">06 / Case C: same key with a different body is a conflict</text>
<text x="88" y="1522" font-size="18" fill="#1e293b">A fingerprint mismatch raises IdempotencyConflict. The API returns 409; no second card is</text>
<text x="88" y="1549" font-size="18" fill="#1e293b">created. Storage errors return a sanitized 503. The chat retains its submission for an</text>
<text x="88" y="1576" font-size="18" fill="#1e293b">explicit retry rather than generating a fresh key.</text>
<a href="../../src/card_servicing/persistence.py"><text x="88" y="1610" font-size="16" fill="#1d4ed8">src/card_servicing/persistence.py:78</text></a>
<a href="../../src/card_servicing/cards.py"><text x="88" y="1635" font-size="16" fill="#1d4ed8">src/card_servicing/cards.py:48</text></a>
<path d="M600 1677 V1710" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="60" y="1720" width="1080" height="194" rx="12" fill="white" stroke="#cbd5e1"/>
<rect x="60" y="1720" width="9" height="194" rx="4" fill="#1d4ed8"/>
<text x="88" y="1755" class="heading" font-size="23" fill="#1d4ed8">07 / Boundary: API durability does not restore chat memory</text>
<text x="88" y="1789" font-size="18" fill="#1e293b">SQLite retains cards and committed keys across API restarts. Chat drafts and submission keys</text>
<text x="88" y="1816" font-size="18" fill="#1e293b">disappear on chat restart; do not start a new conversation to retry an uncertain write. A new</text>
<text x="88" y="1843" font-size="18" fill="#1e293b">key means a new operation even when the body is identical.</text>
<a href="../../src/card_chat/main.py"><text x="88" y="1877" font-size="16" fill="#1d4ed8">src/card_chat/main.py:54</text></a>
<text x="60" y="1999" font-size="15" fill="#475569">Source: card-chat-flows.json | Regenerate: python scripts/render_chat_diagrams.py</text>
</svg>
