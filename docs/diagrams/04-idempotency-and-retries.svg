<title id="title">04 / Idempotency and retries - sequence diagram</title>
<desc id="description">Chat prevents duplicate submissions in memory; SQLite durably protects repeated HTTP requests. Read interactions from top to bottom. Dashed arrows are replies.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#334155"/></marker></defs>
<style>text{font-family:Consolas,"Liberation Mono",monospace}.heading{font-family:Arial,sans-serif;font-weight:700}</style>
<rect width="1400" height="2491" fill="#fff"/>
<text x="40" y="55" class="heading" font-size="32" fill="#0f172a">04 / Idempotency and retries</text>
<text x="40" y="90" font-size="18" fill="#475569">Chat prevents duplicate submissions in memory; SQLite durably protects repeated HTTP requests.</text>
<text x="40" y="120" font-size="16" fill="#475569">Time flows downward | Solid arrow: call | Dashed arrow: reply | Yellow: explanation</text>
<path d="M130.0 207 V2056" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="19.0" y="155" width="222" height="52" rx="7" fill="#155e75"/>
<text x="130.0" y="187" text-anchor="middle" class="heading" font-size="19" fill="white">Browser</text>
<path d="M510.0 207 V2056" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="399.0" y="155" width="222" height="52" rx="7" fill="#1d4ed8"/>
<text x="510.0" y="187" text-anchor="middle" class="heading" font-size="19" fill="white">Chat workflow</text>
<path d="M890.0 207 V2056" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="779.0" y="155" width="222" height="52" rx="7" fill="#0f766e"/>
<text x="890.0" y="187" text-anchor="middle" class="heading" font-size="19" fill="white">Cards REST API</text>
<path d="M1270.0 207 V2056" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="1159.0" y="155" width="222" height="52" rx="7" fill="#334155"/>
<text x="1270.0" y="187" text-anchor="middle" class="heading" font-size="19" fill="white">SQLite</text>
<rect x="174.25" y="240" width="291.5" height="31" fill="white"/>
<text x="320.0" y="260" text-anchor="middle" font-size="16" fill="#0f172a">First valid Create card click</text>
<path d="M130.0 278 H510.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="505.75" y="311" width="348.5" height="55" fill="white"/>
<text x="680.0" y="331" text-anchor="middle" font-size="16" fill="#0f172a">Lock; freeze body B; generate key K</text>
<text x="680.0" y="355" text-anchor="middle" font-size="16" fill="#0f172a">once</text>
<path d="M510.0 373 H575.0 V395 H510.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="521.0" y="431" width="358.0" height="55" fill="white"/>
<text x="700.0" y="451" text-anchor="middle" font-size="16" fill="#0f172a">Via approved agent proposal and MCP:</text>
<text x="700.0" y="475" text-anchor="middle" font-size="16" fill="#0f172a">POST body B, key K</text>
<path d="M510.0 493 H890.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="895.25" y="526" width="329.5" height="55" fill="white"/>
<text x="1060.0" y="546" text-anchor="middle" font-size="16" fill="#0f172a">Validate and normalize B; compute</text>
<text x="1060.0" y="570" text-anchor="middle" font-size="16" fill="#0f172a">SHA-256 fingerprint</text>
<path d="M890.0 588 H955.0 V610 H890.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="953.25" y="646" width="253.5" height="31" fill="white"/>
<text x="1080.0" y="666" text-anchor="middle" font-size="16" fill="#0f172a">BEGIN IMMEDIATE; lookup K</text>
<path d="M890.0 684 H1270.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="722" width="1330" height="49" rx="5" fill="#e0e7ff" stroke="#cbd5e1"/>
<text x="55" y="747" font-size="17" fill="#1e293b">Case A: K is new</text>
<rect x="896.25" y="778" width="367.5" height="55" fill="white"/>
<text x="1080.0" y="798" text-anchor="middle" font-size="16" fill="#0f172a">Insert card AND saved response for K;</text>
<text x="1080.0" y="822" text-anchor="middle" font-size="16" fill="#0f172a">commit atomically</text>
<path d="M890.0 840 H1270.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1010.25" y="873" width="139.5" height="31" fill="white"/>
<text x="1080.0" y="893" text-anchor="middle" font-size="16" fill="#0f172a">Original card</text>
<path d="M1270.0 911 H890.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="601.75" y="944" width="196.5" height="31" fill="white"/>
<text x="700.0" y="964" text-anchor="middle" font-size="16" fill="#0f172a">201; replayed=false</text>
<path d="M890.0 982 H510.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="35" y="1020" width="1330" height="49" rx="5" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="55" y="1045" font-size="17" fill="#1e293b">If response is lost after commit, keep the same submission body and key for retry.</text>
<rect x="35" y="1081" width="1330" height="49" rx="5" fill="#e0e7ff" stroke="#cbd5e1"/>
<text x="55" y="1106" font-size="17" fill="#1e293b">Case B: retry K with the same normalized B</text>
<rect x="516.25" y="1137" width="367.5" height="55" fill="white"/>
<text x="700.0" y="1157" text-anchor="middle" font-size="16" fill="#0f172a">Retry through MCP with the same B and</text>
<text x="700.0" y="1181" text-anchor="middle" font-size="16" fill="#0f172a">K</text>
<path d="M510.0 1199 H890.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="905.75" y="1232" width="348.5" height="55" fill="white"/>
<text x="1080.0" y="1252" text-anchor="middle" font-size="16" fill="#0f172a">Lookup K; fingerprint matches; read</text>
<text x="1080.0" y="1276" text-anchor="middle" font-size="16" fill="#0f172a">saved response</text>
<path d="M890.0 1294 H1270.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="934.25" y="1327" width="291.5" height="31" fill="white"/>
<text x="1080.0" y="1347" text-anchor="middle" font-size="16" fill="#0f172a">Same original card; no insert</text>
<path d="M1270.0 1365 H890.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="606.5" y="1398" width="187.0" height="31" fill="white"/>
<text x="700.0" y="1418" text-anchor="middle" font-size="16" fill="#0f172a">201; replayed=true</text>
<path d="M890.0 1436 H510.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="221.75" y="1469" width="196.5" height="31" fill="white"/>
<text x="320.0" y="1489" text-anchor="middle" font-size="16" fill="#0f172a">Same card reference</text>
<path d="M510.0 1507 H130.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="35" y="1545" width="1330" height="49" rx="5" fill="#e0e7ff" stroke="#cbd5e1"/>
<text x="55" y="1570" font-size="17" fill="#1e293b">Completed duplicate click</text>
<rect x="202.75" y="1601" width="234.5" height="31" fill="white"/>
<text x="320.0" y="1621" text-anchor="middle" font-size="16" fill="#0f172a">Click Create card again</text>
<path d="M130.0 1639 H510.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="131.5" y="1672" width="377.0" height="55" fill="white"/>
<text x="320.0" y="1692" text-anchor="middle" font-size="16" fill="#0f172a">Cached success; no Claude, MCP or REST</text>
<text x="320.0" y="1716" text-anchor="middle" font-size="16" fill="#0f172a">call</text>
<path d="M510.0 1734 H130.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="35" y="1772" width="1330" height="49" rx="5" fill="#e0e7ff" stroke="#cbd5e1"/>
<text x="55" y="1797" font-size="17" fill="#1e293b">Case C: K reused with a different normalized body</text>
<rect x="929.5" y="1828" width="301.0" height="31" fill="white"/>
<text x="1080.0" y="1848" text-anchor="middle" font-size="16" fill="#0f172a">Lookup K; fingerprint mismatch</text>
<path d="M890.0 1866 H1270.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="920.0" y="1899" width="320.0" height="31" fill="white"/>
<text x="1080.0" y="1919" text-anchor="middle" font-size="16" fill="#0f172a">IdempotencyConflict; no new card</text>
<path d="M1270.0 1937 H890.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="35" y="1975" width="1330" height="49" rx="5" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="55" y="2000" font-size="17" fill="#1e293b">API returns 409 on conflict. API keys are durable; chat state is memory-only. New key = new operation.</text>
