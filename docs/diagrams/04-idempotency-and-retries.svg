<rect x="726.5" y="1149" width="282.0" height="55" fill="white"/>
<text x="867.5" y="1169" text-anchor="middle" font-size="16" fill="#0f172a">201 replayed=false (response</text>
<text x="867.5" y="1193" text-anchor="middle" font-size="16" fill="#0f172a">may be lost after commit)</text>
<path d="M1015.0 1211 H720.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="35" y="1249" width="1370" height="49" rx="5" fill="#e0e7ff" stroke="#cbd5e1"/>
<text x="55" y="1274" font-size="17" fill="#1e293b">Same confirmed create_card submission after uncertain outcome</text>
<rect x="726.5" y="1305" width="282.0" height="55" fill="white"/>
<text x="867.5" y="1325" text-anchor="middle" font-size="16" fill="#0f172a">Retry via MCP with identical</text>
<text x="867.5" y="1349" text-anchor="middle" font-size="16" fill="#0f172a">B and K; no model call</text>
<path d="M720.0 1367 H1015.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1026.25" y="1400" width="272.5" height="55" fill="white"/>
<text x="1162.5" y="1420" text-anchor="middle" font-size="16" fill="#0f172a">Fingerprint matches K: read</text>
<text x="1162.5" y="1444" text-anchor="middle" font-size="16" fill="#0f172a">saved response</text>
<path d="M1015.0 1462 H1310.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1050.0" y="1495" width="225.0" height="55" fill="white"/>
<text x="1162.5" y="1515" text-anchor="middle" font-size="16" fill="#0f172a">Same original card; no</text>
<text x="1162.5" y="1539" text-anchor="middle" font-size="16" fill="#0f172a">second insert</text>
<path d="M1310.0 1557 H1015.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="778.75" y="1590" width="177.5" height="31" fill="white"/>
<text x="867.5" y="1610" text-anchor="middle" font-size="16" fill="#0f172a">201 replayed=true</text>
