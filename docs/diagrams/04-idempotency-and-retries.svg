<text x="1310.0" y="187" text-anchor="middle" class="heading" font-size="19" fill="white">SQLite</text>
<rect x="35" y="245" width="1370" height="74" rx="5" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="55" y="270" font-size="17" fill="#1e293b">React calls only Experience. OIDC session + CSRF at the browser boundary; separate bearer identities internally. Agent journals</text>
<text x="55" y="295" font-size="17" fill="#1e293b">jobs and reviewed submissions in SQLite before execution.</text>
