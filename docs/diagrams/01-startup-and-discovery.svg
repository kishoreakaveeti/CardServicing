<rect x="779.0" y="155" width="222" height="52" rx="7" fill="#047857"/>
<text x="890.0" y="187" text-anchor="middle" class="heading" font-size="19" fill="white">MCP HTTP service</text>
<path d="M1270.0 207 V1205" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="1159.0" y="155" width="222" height="52" rx="7" fill="#9a3412"/>
<text x="1270.0" y="187" text-anchor="middle" class="heading" font-size="19" fill="white">Hosted Claude</text>
<rect x="150.5" y="240" width="339.0" height="55" fill="white"/>
<text x="320.0" y="260" text-anchor="middle" font-size="16" fill="#0f172a">Load tools.json; validate version,</text>
<text x="320.0" y="284" text-anchor="middle" font-size="16" fill="#0f172a">entries and operation IDs</text>
<path d="M130.0 302 H510.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="141.0" y="335" width="358.0" height="55" fill="white"/>
<text x="320.0" y="355" text-anchor="middle" font-size="16" fill="#0f172a">Compiled method/path, public inputs,</text>
<text x="320.0" y="379" text-anchor="middle" font-size="16" fill="#0f172a">policies and response schema</text>
<path d="M510.0 397 H130.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="174.25" y="430" width="671.5" height="31" fill="white"/>
<text x="510.0" y="450" text-anchor="middle" font-size="16" fill="#0f172a">Connect to MCP_URL over Streamable HTTP with destination bearer token</text>
<path d="M130.0 468 H890.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="521.0" y="501" width="358.0" height="55" fill="white"/>
<text x="700.0" y="521" text-anchor="middle" font-size="16" fill="#0f172a">Compile the same catalogue and local</text>
<text x="700.0" y="545" text-anchor="middle" font-size="16" fill="#0f172a">OpenAPI document</text>
