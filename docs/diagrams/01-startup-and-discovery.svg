<rect x="530.5" y="596" width="339.0" height="55" fill="white"/>
<text x="700.0" y="616" text-anchor="middle" font-size="16" fill="#0f172a">Only listed operations; one shared</text>
<text x="700.0" y="640" text-anchor="middle" font-size="16" fill="#0f172a">HTTP execution handler</text>
