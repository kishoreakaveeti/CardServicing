<rect x="125.75" y="833" width="348.5" height="55" fill="white"/>
<text x="300.0" y="853" text-anchor="middle" font-size="16" fill="#0f172a">Verify discovered definitions match</text>
<text x="300.0" y="877" text-anchor="middle" font-size="16" fill="#0f172a">compiled catalogue</text>
<path d="M130.0 895 H195.0 V917 H130.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="136.25" y="953" width="1127.5" height="55" fill="white"/>
<text x="700.0" y="973" text-anchor="middle" font-size="16" fill="#0f172a">Shared allowlist builder: recent sanitised turns, opaque verified draft facts, stable eligible tool schemas; optional</text>
<text x="700.0" y="997" text-anchor="middle" font-size="16" fill="#0f172a">static-prefix cache</text>
<path d="M130.0 1015 H1270.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="459.25" y="1048" width="481.5" height="31" fill="white"/>
<text x="700.0" y="1068" text-anchor="middle" font-size="16" fill="#0f172a">Clarifying/normal reply OR one proposed tool call</text>
<path d="M1270.0 1086 H130.0" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<rect x="35" y="1124" width="1330" height="49" rx="5" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="55" y="1149" font-size="17" fill="#1e293b">Claude does not fetch OpenAPI, call localhost or supply execution headers. Keys stay outside its schema.</text>
