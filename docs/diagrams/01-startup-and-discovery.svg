<rect width="1400" height="1515" fill="#fff"/>
<text x="40" y="55" class="heading" font-size="32" fill="#0f172a">01 / Startup and tool discovery</text>
<text x="40" y="90" font-size="18" fill="#475569">Catalogue and OpenAPI determine registered capabilities; the chat backend discovers tools over MCP.</text>
<text x="40" y="120" font-size="16" fill="#475569">Time flows downward | Solid arrow: call | Dashed arrow: reply | Yellow: explanation</text>
