<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1515" viewBox="0 0 1400 1515" role="img" aria-labelledby="title description">
<title id="title">01 / Startup and tool discovery - sequence diagram</title>
<desc id="description">Catalogue and OpenAPI determine registered capabilities; the chat backend discovers tools over MCP. Read interactions from top to bottom. Dashed arrows are replies.</desc>
