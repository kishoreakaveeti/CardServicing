<text x="40" y="90" font-size="18" fill="#475569">The local chat backend discovers MCP. Claude does not browse OpenAPI or call localhost.</text>
<text x="40" y="120" font-size="16" fill="#475569">Time flows downward | Solid arrow: call | Dashed arrow: reply | Yellow: explanation</text>
