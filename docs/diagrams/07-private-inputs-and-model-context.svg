<text x="55" y="270" font-size="17" fill="#1e293b">Primary entry: customer describes the request in chat. Claude may propose an eligible tool with incomplete arguments; Reply.input_tool opens its private</text>
<text x="55" y="295" font-size="17" fill="#1e293b">form automatically. Manual action selection is an optional secondary zero-model path. Execution still requires complete original-schema validation and</text>
<text x="55" y="320" font-size="17" fill="#1e293b">confirmation.</text>
<rect x="156.75" y="351" width="234.5" height="55" fill="white"/>
<text x="274.0" y="371" text-anchor="middle" font-size="16" fill="#0f172a">Get conversation-scoped</text>
<text x="274.0" y="395" text-anchor="middle" font-size="16" fill="#0f172a">action form</text>
