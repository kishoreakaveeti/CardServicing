<text x="55" y="2215" font-size="17" fill="#1e293b">Confirmation, duplicate clicks and eligible retries make zero Claude calls. Raw tool results never enter model context. Optional ephemeral caching marks</text>
<text x="55" y="2240" font-size="17" fill="#1e293b">only the stable system prefix after eligible tool schemas; conversation content is uncached.</text>
