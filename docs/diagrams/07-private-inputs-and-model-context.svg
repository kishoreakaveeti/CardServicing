<rect x="715.25" y="1364" width="557.5" height="55" fill="white"/>
<text x="994.0" y="1384" text-anchor="middle" font-size="16" fill="#0f172a">Allowlisted recent context and opaque draft facts; stable</text>
<text x="994.0" y="1408" text-anchor="middle" font-size="16" fill="#0f172a">tools + instructions before dynamic content</text>
<path d="M706.0 1426 H1282.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
