name: card-servicing-http
x-python: &python
  build: {context: ., target: runtime}
  command: [python, scripts/service_entrypoint.py]
  restart: unless-stopped
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    interval: 5s
    timeout: 4s
    retries: 30
    start_period: 15s
x-oidc: &oidc
  OIDC_ISSUER: http://localhost:8081/realms/cards
  OIDC_JWKS_URL: http://identity:8080/realms/cards/protocol/openid-connect/certs
  OIDC_TOKEN_URL: http://identity:8080/realms/cards/protocol/openid-connect/token
  DELEGATION_PUBLIC_KEY: /keys/delegation-public.pem
x-telemetry: &telemetry
  TELEMETRY_SINK: ${TELEMETRY_SINK:-mongo}
  MONGODB_HOST: mongodb
  MONGODB_PORT: "27017"
  MONGODB_DATABASE: ${MONGODB_DATABASE:-card_servicing}
  MONGO_USER: ${MONGO_USER:?Run scripts/setup-stack.ps1}
  MONGO_PASSWORD: ${MONGO_PASSWORD:?Run scripts/setup-stack.ps1}
  ACCOUNT_HASH_KEY: ${ACCOUNT_HASH_KEY:-}
  ACCOUNT_HASH_KEY_VERSION: ${ACCOUNT_HASH_KEY_VERSION:-v1}
services:
  frontend:
    container_name: card-servicing-frontend
    build: {context: ./frontend, target: runtime}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      experience: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 20
  experience:
    container_name: card-servicing-experience
    <<: *python
    environment:
      <<: [*oidc, *telemetry]
      APP_MODULE: card_chat.experience:app
      AGENT_URL: http://cards-agent:8000
      CARD_API_BASE_URL: http://cards-api:8000
      PUBLIC_ORIGIN: http://localhost:8080
      OIDC_AUTHORIZE_URL: http://localhost:8081/realms/cards/protocol/openid-connect/auth
      SERVICE_CLIENT_ID: experience-service
      SERVICE_CLIENT_SECRET: ${EXPERIENCE_SECRET:?Run scripts/setup-stack.ps1}
      BROWSER_CLIENT_SECRET: ${BROWSER_SECRET:?Run scripts/setup-stack.ps1}
      DELEGATION_PRIVATE_KEY: /keys/delegation-private.pem
      SESSION_DB: /data/sessions.db
    volumes:
      - experience_data:/data
      - ./data/identity/delegation-private.pem:/keys/delegation-private.pem:ro
    depends_on:
      cards-agent: {condition: service_healthy}
  cards-agent:
    container_name: card-servicing-agent
    <<: *python
    environment:
      <<: [*oidc, *telemetry]
      APP_MODULE: card_chat.main:app
      MCP_URL: http://mcp-server:8000/mcp
      CARD_API_BASE_URL: http://cards-api:8000
      FINCRIME_AGENT_URL: http://fincrime-agent:8000
      FINCRIME_API_BASE_URL: http://fincrime-api:8000
      MODEL_PROVIDER: ${STACK_MODEL_PROVIDER:-stub}
      MODEL_ID: ${MODEL_ID:-}
      ANTHROPIC_PROMPT_CACHE: ${ANTHROPIC_PROMPT_CACHE:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SERVICE_CLIENT_ID: agent-service
      SERVICE_CLIENT_SECRET: ${AGENT_SECRET:?Run scripts/setup-stack.ps1}
      AGENT_DB: /data/agent.db
      QDRANT_URL: http://qdrant:6333
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
      FASTEMBED_MODEL: ${FASTEMBED_MODEL:-BAAI/bge-small-en-v1.5}
      POLICY_COLLECTION: ${POLICY_COLLECTION:-banking_policies}
      POLICY_AUDIT_LOG: /data/policy_audit.json
      POLICY_VECTOR_STORE: ${POLICY_VECTOR_STORE:-qdrant}
      POLICIES_DIR: /app/policies
    volumes:
      - agent_data:/data
      - ./policies:/app/policies:ro
      - ./data/identity/delegation-public.pem:/keys/delegation-public.pem:ro
    depends_on:
      mcp-server: {condition: service_healthy}
      fincrime-agent: {condition: service_healthy}
      qdrant: {condition: service_healthy}
  fincrime-agent:
    container_name: fincrime-agent
    build: {context: ., dockerfile: Dockerfile.fincrime-agent, target: runtime}
    command: [python, scripts/service_entrypoint.py]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    environment:
      <<: [*oidc, *telemetry]
      APP_MODULE: card_chat.fincrime_agent:app
      MODEL_PROVIDER: ${STACK_MODEL_PROVIDER:-stub}
      MODEL_ID: ${MODEL_ID:-}
      ANTHROPIC_PROMPT_CACHE: ${ANTHROPIC_PROMPT_CACHE:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SERVICE_CLIENT_ID: agent-service
      SERVICE_CLIENT_SECRET: ${AGENT_SECRET:?Run scripts/setup-stack.ps1}
    volumes:
      - ./data/identity/delegation-public.pem:/keys/delegation-public.pem:ro
  mcp-server:
    container_name: card-servicing-mcp
    <<: *python
    environment:
      <<: [*oidc, *telemetry]
      APP_MODULE: card_chat.mcp_server:app
      CARD_API_BASE_URL: http://cards-api:8000
      FINCRIME_API_BASE_URL: http://fincrime-api:8000
      MCP_RESOURCE: http://mcp-server:8000/mcp
      SERVICE_CLIENT_ID: mcp-service
      SERVICE_CLIENT_SECRET: ${MCP_SECRET:?Run scripts/setup-stack.ps1}
    volumes:
      - ./data/identity/delegation-public.pem:/keys/delegation-public.pem:ro
    depends_on:
      cards-api: {condition: service_healthy}
      fincrime-api: {condition: service_healthy}
      identity: {condition: service_healthy}
  fincrime-api:
    container_name: fincrime-api
    build: {context: ., dockerfile: Dockerfile.fincrime-api, target: runtime}
    command: [python, scripts/service_entrypoint.py]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    environment:
      <<: [*oidc, *telemetry]
      APP_MODULE: fincrime_servicing.main:app
      CARD_API_BASE_URL: http://cards-api:8000
      FINCRIME_DB: /data/fincrime.db
      SERVICE_CLIENT_ID: mcp-service
      SERVICE_CLIENT_SECRET: ${MCP_SECRET:?Run scripts/setup-stack.ps1}
    volumes:
      - fincrime_data:/data
      - ./data/identity/delegation-public.pem:/keys/delegation-public.pem:ro
    depends_on:
      cards-api: {condition: service_healthy}
      mongodb: {condition: service_healthy}
  cards-api:
    container_name: cards-api
    <<: *python
    environment:
      <<: [*oidc, *telemetry]
      APP_MODULE: card_servicing.main:app
      CARD_STORE: sqlite
      SQLITE_PATH: /data/cards.db
    volumes:
      - cards_data:/data
      - ./policies:/app/policies:ro
      - ./data/identity/delegation-public.pem:/keys/delegation-public.pem:ro
    depends_on:
      mongodb: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  mongodb:
    container_name: card-servicing-mongodb
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Run scripts/setup-stack.ps1}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Run scripts/setup-stack.ps1}
    ports: ["127.0.0.1:${MONGODB_HOST_PORT:-27018}:27017"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  identity:
    container_name: card-servicing-identity
    image: quay.io/keycloak/keycloak:26.4.7
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${IDENTITY_ADMIN_PASSWORD:?Run scripts/setup-stack.ps1}
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - ./data/identity/realm.json:/opt/keycloak/data/import/realm.json:ro
      - identity_data:/opt/keycloak/data
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
  qdrant:
    container_name: card-servicing-qdrant
    image: qdrant/qdrant:v1.13.4
    ports: ["127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333", "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/6333; printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
volumes:
  agent_data:
  experience_data:
  cards_data:
  fincrime_data:
  identity_data:
  mongodb_data:
  qdrant_data:
