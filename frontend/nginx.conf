server {
  listen 8080;
  root /usr/share/nginx/html;
  # OIDC callback query strings contain short-lived authorization credentials.
  access_log off;
  client_max_body_size 32k;
  add_header X-Content-Type-Options nosniff always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  location /api/ { proxy_pass http://experience:8000; proxy_read_timeout 130s; }
  location /auth/ { proxy_pass http://experience:8000; proxy_read_timeout 30s; }
  location /health { access_log off; return 200 'ok'; }
  location / { try_files $uri /index.html; }
}
