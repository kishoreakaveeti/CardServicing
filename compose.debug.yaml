# Opt-in only. Flags select one listener while other components run normally.
services:
  frontend:
    build: {target: debug}
  experience:
    build: {target: debug}
    environment:
      DEBUG_ENABLED: ${DEBUG_EXPERIENCE:-1}
      DEBUG_WAIT: ${DEBUG_WAIT_EXPERIENCE:-0}
    ports: ["127.0.0.1:5681:5678"]
  agent:
    build: {target: debug}
    environment:
      DEBUG_ENABLED: ${DEBUG_AGENT:-1}
      DEBUG_WAIT: ${DEBUG_WAIT_AGENT:-0}
    ports: ["127.0.0.1:5682:5678"]
  mcp:
    build: {target: debug}
    environment:
      DEBUG_ENABLED: ${DEBUG_MCP:-1}
      DEBUG_WAIT: ${DEBUG_WAIT_MCP:-0}
    ports: ["127.0.0.1:5683:5678"]
  cards:
    build: {target: debug}
    environment:
      DEBUG_ENABLED: ${DEBUG_CARDS:-1}
      DEBUG_WAIT: ${DEBUG_WAIT_CARDS:-0}
    ports: ["127.0.0.1:5684:5678"]
