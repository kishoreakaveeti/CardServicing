[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-servicing"
version = "0.1.0"
description = "A small REST API and a separate Python client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "pymongo>=4.10,<5",
    "azure-storage-blob>=12.24,<13",
    "azure-identity>=1.19,<2",
    "python-dotenv>=1,<2",
    "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
chat = [
    "mcp>=1.30,<2",
    "jsonschema>=4.20,<5",
    "anthropic>=0.40,<1",
    "langgraph>=0.2,<2",
    "langchain>=0.3,<2",
    "langchain-anthropic>=0.3,<2",
    "presidio-analyzer>=2.2,<3",
    "presidio-anonymizer>=2.2,<3",
    "qdrant-client>=1.13,<2",
    "fastembed>=0.4,<1",
    "pyyaml>=6.0",
]
infra = [
    "redis>=5,<9",
    "pika>=1.3,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
card_chat = ["*.html", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
