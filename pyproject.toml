[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "card-servicing"
version = "0.1.0"
description = "A small REST API and a separate Python client"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "pymongo>=4.10,<5",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
infra = [
    "redis>=5,<9",
    "pika>=1.3,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
