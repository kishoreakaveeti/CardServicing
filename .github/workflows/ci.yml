name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,chat]"
      - run: python -m pytest
      - run: python scripts/export_cards_openapi.py --check
      - run: python scripts/render_chat_diagrams.py --check
